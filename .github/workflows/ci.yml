name: Build, Test & Release

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  release-metadata:
    name: Validate version and release metadata
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate source and tag
        id: metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/linux-release.py validate --tag "$RELEASE_TAG"

  rust-tests:
    name: Rust tests (${{ matrix.platform }})
    needs: release-metadata
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux-desktop, ubuntu-touch]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --workspace --no-default-features --features ${{ matrix.platform }}
      - run: python3 scripts/release-version.py --check

  click-packages:
    name: Ubuntu Touch (${{ matrix.arch }})
    needs: release-metadata
    runs-on: ubuntu-latest
    env:
      CLICKABLE_DOCKER_COMMAND: docker
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - run: pipx install clickable-ut
      - run: clickable build --config ubuntu-touch/clickable.yaml --arch ${{ matrix.arch }} --non-interactive
      - name: Run Lomiri and shared QML tests
        if: matrix.arch == 'amd64'
        run: clickable test --config ubuntu-touch/clickable.yaml --arch amd64 --non-interactive
      - uses: actions/upload-artifact@v4
        with:
          name: click-package-${{ matrix.arch }}
          path: build/*/app/*.click
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'amd64'
        with:
          name: ui-ubuntu-touch
          path: build/ui/ubuntu-touch/*.png
          if-no-files-found: error

  linux-packages:
    name: Linux desktop (${{ matrix.flavor }}, amd64)
    needs: release-metadata
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - flavor: ubuntu24
            distro: ubuntu:24.04
          - flavor: debian13
            distro: debian:13
    steps:
      - uses: actions/checkout@v4
      - name: Prepare distribution build environment
        run: docker build -f linux/packaging/Dockerfile --build-arg DISTRO=${{ matrix.distro }} -t open-rdp-build .
      - name: Build, test, and package
        run: docker run --rm -v "$PWD:/work" open-rdp-build sh scripts/build-linux-ci.sh ${{ matrix.flavor }}
      - name: Verify installed package in a clean runtime environment
        run: |
          docker run --rm -v "$PWD:/work" -w /work ${{ matrix.distro }} sh -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 xvfb xauth /work/build/linux-${{ matrix.flavor }}/packages/*.deb
            xvfb-run -a env QT_QUICK_BACKEND=software python3 scripts/smoke-linux.py --library-fixture --snapshot-prefix build/ui/linux-${{ matrix.flavor }}/dark-grid
            xvfb-run -a env QT_QUICK_BACKEND=software python3 scripts/smoke-linux.py --theme light --size 800x600 --library-fixture --snapshot-prefix build/ui/linux-${{ matrix.flavor }}/light-minimum
            xvfb-run -a env QT_QUICK_BACKEND=software python3 scripts/smoke-linux.py --theme light --layout list --library-fixture --snapshot-prefix build/ui/linux-${{ matrix.flavor }}/light-list
            xvfb-run -a env QT_QUICK_BACKEND=software python3 scripts/smoke-linux.py --theme light --layout list --font-scale 1.5 --library-fixture --snapshot-prefix build/ui/linux-${{ matrix.flavor }}/large-text
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.flavor }}-amd64
          path: build/linux-${{ matrix.flavor }}/packages/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ui-linux-${{ matrix.flavor }}
          path: build/ui/linux-${{ matrix.flavor }}/*.png
          if-no-files-found: error

  release-linux:
    name: Publish Linux Debian packages
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release-metadata, rust-tests, click-packages, linux-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: linux-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*-amd64
          path: build/linux-release-artifacts
      - name: Stage tested packages with unique names and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SOURCE_SHA: ${{ needs.release-metadata.outputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python3 scripts/linux-release.py stage --tag "$RELEASE_TAG" --artifacts build/linux-release-artifacts --output build/linux-release
      - name: Publish and verify GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: python3 scripts/linux-release.py publish --tag "$RELEASE_TAG" --repo "$RELEASE_REPO" --assets build/linux-release
