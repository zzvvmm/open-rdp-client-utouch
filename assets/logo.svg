<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="55%" stop-color="#005BA1"/>
      <stop offset="100%" stop-color="#003E73"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
  </defs>
  <!-- Ubuntu Touch Suru Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGrad)"/>
  <!-- Desktop Monitor Frame -->
  <rect x="88" y="112" width="336" height="224" rx="22" ry="22" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="104" y="128" width="304" height="192" rx="12" ry="12" fill="url(#screenGrad)"/>
  <!-- Windows App style 4-tile accent inside monitor -->
  <rect x="132" y="152" width="56" height="56" rx="6" fill="#FFFFFF" fill-opacity="0.25"/>
  <rect x="196" y="152" width="56" height="56" rx="6" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="132" y="216" width="56" height="56" rx="6" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="196" y="216" width="56" height="56" rx="6" fill="#FFFFFF" fill-opacity="0.20"/>
  <!-- Remote Desktop Connection Chevrons (><) -->
  <path d="M286 178 L322 214 L286 250" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M366 178 L330 214 L366 250" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Monitor Stand -->
  <path d="M224 336 L288 336 L304 388 L208 388 Z" fill="#E3F2FD"/>
  <rect x="176" y="384" width="160" height="18" rx="9" fill="#FFFFFF"/>
</svg>
